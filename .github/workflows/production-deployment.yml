name: Brainova Production Release Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-validation:
    name: Production Validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify Production Branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Production releases are allowed only from main."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Build Backend
        working-directory: backend
        run: npm run build

      - name: Production Validation Successful
        run: echo "Brainova production validation passed."
