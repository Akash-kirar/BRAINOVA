name: Brainova CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test Brainova
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Step 1: Get repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Step 3: Install dependencies and run checks
      - name: Install, Test and Build
        shell: bash
        run: |
          set -e

          echo "Starting Brainova CI Pipeline..."

          mapfile -t packages < <(
            find . \
              -name package.json \
              -not -path '*/node_modules/*' \
              -not -path '*/.git/*' \
              -not -path '*/.github/*' \
              | sort
          )

          if [ ${#packages[@]} -eq 0 ]; then
            echo "No package.json files found!"
            exit 1
          fi

          for package in "${packages[@]}"; do

            directory=$(dirname "$package")

            echo "--------------------------------"
            echo "Processing: $directory"
            echo "--------------------------------"

            cd "$GITHUB_WORKSPACE/$directory"

            if [ -f package-lock.json ]; then
              npm ci
            else
              echo "Warning: package-lock.json missing. Using npm install."
              npm install
            fi

            npm run lint --if-present
            npm run test --if-present
            npm run build --if-present

          done

          echo "Brainova CI Pipeline completed successfully!"
