name: Brainova Dependency Monitor

on:
  schedule:
    - cron: "0 9 * * 1"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    name: Check npm Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        directory:
          - frontend
          - backend

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Check Dependency Updates
        run: |
          echo "Checking dependencies in $PWD"
          npm outdated --long || true

      - name: Dependency Check Completed
        run: echo "Dependency monitoring completed."
