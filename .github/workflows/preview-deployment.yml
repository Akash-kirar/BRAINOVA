name: Brainova Preview Validation

on:
  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-validation:
    name: Validate Preview Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Preview
        working-directory: frontend
        run: npm run build

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Build Backend Preview
        working-directory: backend
        run: npm run build

      - name: Preview Validation Successful
        run: echo "Both preview builds passed."
